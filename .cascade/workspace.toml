# Correspondence map — Explore full-a substrate
# auto-seed for mcp-tool-manifest
# ResolveAdrMap = longest prefix (not union). "*" = baseline.

[workspace.adr]
auto_include = "linked"
max_related = 8
root_dir = "."
id_regex = '(?:^|/)(?<id>[A-Za-z0-9][^/]*?)(?:\.md)?'

[workspace.adr.map]
"*" = [
  "PACKAGE_README.md",
  "README.md",
]

